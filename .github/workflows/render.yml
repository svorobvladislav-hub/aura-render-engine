name: Render Video Engine

on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fontconfig

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install edge-tts requests

      - name: Execute Render Pipeline
        env:
          RENDER_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          python3 render.py
